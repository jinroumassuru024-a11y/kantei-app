<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手組み診断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Maru+Gothic:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cream: #F8F3EC;
      --ink: #252017;
      --ink-light: #6B6456;
      --s-main: #C4704D;
      --s-light: #F5E8E0;
      --s-dark: #8F4A2E;
      --m-main: #5C7FA3;
      --m-light: #E0EAF4;
      --m-dark: #3A5A7A;
      --white: #FDFBF8;
      --shadow: 0 4px 32px rgba(37,32,23,0.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'Zen Maru Gothic', sans-serif;
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .screen.active {
      display: block;
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 44px 32px 40px;
      box-shadow: var(--shadow);
    }

    .label-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
      background: var(--cream);
      border-radius: 100px;
      padding: 5px 14px;
      margin-bottom: 28px;
    }

    .card-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.02em;
      margin-bottom: 36px;
      color: var(--ink);
    }

    .hand-icon {
      font-size: 52px;
      margin-bottom: 8px;
      display: block;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.06) rotate(3deg); }
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--s-main), var(--m-main));
      border-radius: 2px;
      margin: 0 0 36px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 18px 20px;
      border: none;
      border-radius: 18px;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }

    .btn:active { transform: scale(0.97); opacity: 0.88; }

    .btn-s { background: var(--s-light); color: var(--s-dark); }
    .btn-s:hover { background: #EDD9CE; box-shadow: 0 4px 16px rgba(196,112,77,0.18); }
    .btn-m { background: var(--m-light); color: var(--m-dark); }
    .btn-m:hover { background: #CDDCED; box-shadow: 0 4px 16px rgba(92,127,163,0.18); }

    .btn-icon { font-size: 22px; flex-shrink: 0; }

    .result-card { border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }

    .result-header { padding: 40px 32px 32px; position: relative; }
    .result-header.s-type { background: linear-gradient(145deg, var(--s-main) 0%, #A8593C 100%); }
    .result-header.m-type { background: linear-gradient(145deg, var(--m-main) 0%, #456A91 100%); }

    .type-badge {
      font-family: 'Shippori Mincho', serif;
      font-size: 72px;
      font-weight: 700;
      color: rgba(255,255,255,0.18);
      position: absolute;
      top: 16px;
      right: 24px;
      line-height: 1;
      user-select: none;
    }

    .result-label { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 10px; }
    .result-type-name { font-family: 'Shippori Mincho', serif; font-size: 34px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .result-subtitle { font-size: 14px; color: rgba(255,255,255,0.85); font-weight: 400; }

    .result-body { background: var(--white); padding: 32px 32px 28px; }
    .result-text { font-family: 'Shippori Mincho', serif; font-size: 18px; line-height: 1.9; color: var(--ink); margin-bottom: 28px; }

    .disclaimer {
      font-size: 12px;
      color: var(--ink-light);
      line-height: 1.7;
      padding: 16px;
      background: var(--cream);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .btn-retry {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(37,32,23,0.12);
      border-radius: 18px;
      background: transparent;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-light);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-retry:hover { border-color: var(--ink-light); color: var(--ink); background: var(--cream); }
    .btn-retry:active { transform: scale(0.97); }

    .result-icon-row { display: flex; gap: 6px; margin-bottom: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.45); }
    .dot.active { background: rgba(255,255,255,0.95); width: 24px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- TOP SCREEN -->
  <div class="screen active" id="screen-top">
    <div class="card">
      <span class="hand-icon">🤲</span>
      <div class="divider"></div>
      <span class="label-pill">手組み診断</span>
      <p class="card-title">両手を出して、指を組んで握ってください。<br>準備はいいですか？</p>
      <div class="btn-group">
        <button class="btn btn-s" onclick="showResult('s')">
          <span class="btn-icon">✊</span>
          <span>それぞれの手で握った</span>
        </button>
        <button class="btn btn-m" onclick="showResult('m')">
          <span class="btn-icon">🤝</span>
          <span>手を合わせて指を組んで握った</span>
        </button>
      </div>
    </div>
  </div>

  <!-- S TYPE RESULT -->
  <div class="screen" id="screen-s">
    <div class="result-card">
      <div class="result-header s-type">
        <div class="type-badge">S</div>
        <div class="result-icon-row">
          <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <p class="result-label">Your Type</p>
        <h2 class="result-type-name" id="s-title">Sタイプ</h2>
        <p class="result-subtitle" id="s-subtitle">自分の軸を持つ、独立型</p>
      </div>
      <div class="result-body">
        <p class="result-text" id="s-description">あなたはSタイプ。自分のペースを大切にする人。人に流されず、自分の軸で物事を決めていくタイプです。</p>
        <p class="disclaimer">これは科学的根拠のある診断ではなく、ちょっとした話のネタとして楽しんでください。</p>
        <button class="btn-retry" onclick="goBack()">← もう一度やってみる</button>
      </div>
    </div>
  </div>

  <!-- M TYPE RESULT -->
  <div class="screen" id="screen-m">
    <div class="result-card">
      <div class="result-header m-type">
        <div class="type-badge">M</div>
        <div class="result-icon-row">
          <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <p class="result-label">Your Type</p>
        <h2 class="result-type-name" id="m-title">Mタイプ</h2>
        <p class="result-subtitle" id="m-subtitle">つながりから力を得る、協調型</p>
      </div>
      <div class="result-body">
        <p class="result-text" id="m-description">あなたはMタイプ。人との繋がりを大切にする人。誰かと一緒にいることで力を発揮するタイプです。</p>
        <p class="disclaimer">これは科学的根拠のある診断ではなく、ちょっとした話のネタとして楽しんでください。</p>
        <button class="btn-retry" onclick="goBack()">← もう一度やってみる</button>
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // ⚙️  CONFIG (Vercelの環境変数で自動置換されます)
    // ================================================================
    const SUPABASE_URL = '__SUPABASE_URL__';
    const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

    const configured = SUPABASE_URL !== '__SUPABASE_URL__' && SUPABASE_URL.length > 10;
    let db = null;
    if (configured) {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      loadSettings();
    }

    async function loadSettings() {
      try {
        const { data } = await db.from('settings').select('key, value');
        if (!data) return;
        data.forEach(row => {
          const v = row.value;
          if (row.key === 's_type') {
            if (v.title)       document.getElementById('s-title').textContent = v.title;
            if (v.subtitle)    document.getElementById('s-subtitle').textContent = v.subtitle;
            if (v.description) document.getElementById('s-description').textContent = v.description;
          }
          if (row.key === 'm_type') {
            if (v.title)       document.getElementById('m-title').textContent = v.title;
            if (v.subtitle)    document.getElementById('m-subtitle').textContent = v.subtitle;
            if (v.description) document.getElementById('m-description').textContent = v.description;
          }
        });
      } catch(e) {}
    }

    async function recordResult(type) {
      if (!db) return;
      try { await db.from('results').insert({ type }); } catch(e) {}
    }

    async function showResult(type) {
      await recordResult(type.toUpperCase());
      document.getElementById('screen-top').classList.remove('active');
      setTimeout(() => {
        document.getElementById('screen-' + type).classList.add('active');
      }, 80);
    }

    function goBack() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      setTimeout(() => {
        document.getElementById('screen-top').classList.add('active');
      }, 80);
    }
  </script>
</body>
</html>
