    .intro-h { position:relative;z-index:1;font-family:'Shippori Mincho',serif;font-size:34px;font-weight:800;line-height:1.28;color:#fff;letter-spacing:-.01em;margin-bottom:18px; }

    .q-prog-wrap { height:3px;background:rgba(26,23,20,.1);border-radius:2px;margin-bottom:32px;overflow:hidden; }
    .q-prog-fill { height:100%;background:var(--ink);border-radius:2px;transition:width .4s cubic-bezier(.22,1,.36,1); }

    @keyframes reveal { from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:none} }
    .rhead { padding:44px 30px 34px;position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end; }
    .rhead-bg-icon { position:absolute;top:20px;right:16px;font-size:110px;opacity:.18;line-height:1;user-select:none;animation:float 5s ease-in-out infinite; }

    .rhead-name { font-family:'Shippori Mincho',serif;font-size:28px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:14px;position:relative;z-index:1;letter-spacing:-.01em; }

    .rcatch { padding:26px 30px 22px;font-family:'Shippori Mincho',serif;font-size:16px;line-height:1.9;color:var(--ink);border-bottom:1px solid rgba(26,23,20,.07);font-style:italic; }
    .rcatch::before { content:'「'; }
    .rcatch::after { content:'」'; }
    .rsec { padding:22px 30px;border-bottom:1px solid rgba(26,23,20,.07);animation:secin .5s ease both; }
    .rsec:nth-child(1){animation-delay:.15s}.rsec:nth-child(2){animation-delay:.28s}.rsec:nth-child(3){animation-delay:.41s}
    @keyframes secin { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none} }

    .rsec-head::after { content:'';flex:1;height:1px;background:rgba(26,23,20,.07); }
    .rsec-body { font-family:'Shippori Mincho',serif;font-size:15px;line-height:1.95;color:var(--ink); }
    .rall-ans { padding:18px 30px 0;display:flex;flex-wrap:wrap;gap:5px; }
    .ans-chip { font-size:10px;padding:4px 10px;border-radius:100px;background:rgba(26,23,20,.06);color:var(--ink-mid);letter-spacing:.04em; }
    .rfoot { padding:22px 30px 30px; }
    .btn-copy { width:100%;padding:17px;background:#1A1714;color:#fff;border:none;border-radius:16px;font-family:'Shippori Mincho',serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .2s;margin-bottom:9px; }

</head>

/* ── 6 QUESTIONS ── */

  AAB:'仕事も楽しみも大事派',
  ABA:'キャリア重視・堅実独立派',
  ABB:'キャリア重視・享楽独立派',
  BAA:'愛情深い・堅実サポート派',
  BAB:'愛情深い・楽しい助け合い派',
  BBA:'献身的・堅実独立派',
  BBB:'献身的・享楽自立派',
};

/* ── HEAD COLORS (Q1+Q4) ── */
const HEAD_COLORS = {
  AA:'linear-gradient(145deg,#B06040 0%,#782A10 100%)',
  AB:'linear-gradient(145deg,#3A5878 0%,#1A3858 100%)',
  BA:'linear-gradient(145deg,#2E6A50 0%,#104A30 100%)',
  BB:'linear-gradient(145deg,#383845 0%,#181825 100%)',
};

/* ── STATE ── */
let answers = [];
let curQ = 0;
let _char = null;

/* ── HELPERS ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  requestAnimationFrame(()=>{ document.getElementById(id).classList.add('active'); window.scrollTo({top:0}); });
}

function patternNum(ans) {
  return parseInt(ans.map(a=>a==='A'?'0':'1').join(''),2)+1;
}

/* ── FLOW ── */
function startDiag() { answers=[]; curQ=0; renderQ(); showScreen('s-q'); }
function restart() { startDiag(); }

function renderQ() {
  const q = Qs[curQ];
  const pct = Math.round((curQ/6)*100);
  document.getElementById('q-prog').style.width = pct+'%';
  document.getElementById('q-cat-lbl').textContent = q.cat;
  document.getElementById('q-step-n').textContent = (curQ+1)+' / 6';
  document.getElementById('q-text').textContent = q.q;

  const opts = document.getElementById('q-opts');
  opts.innerHTML = '';
  ['A','B'].forEach((key,i)=>{
    const o = q[key];
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.style.animationDelay = i*80+'ms';
    btn.innerHTML = `<span class="opt-main">${o.main}</span><span class="opt-sub">${o.sub}</span>`;
    btn.onclick = ()=>selectOpt(key, btn);
    opts.appendChild(btn);
  });
}

function selectOpt(key, btn) {
  btn.classList.add('selected');
  answers[curQ] = key;
  setTimeout(()=>{
    curQ++;
    if(curQ < 6) { renderQ(); }
    else { showLoading(); }
  }, 280);
}

function goBack() {
  if(curQ === 0) { showScreen('s-intro'); return; }
  curQ--;
  answers.pop();
  renderQ();
}

function showLoading() {
  showScreen('s-load');
  requestAnimationFrame(()=>{
    document.getElementById('load-fill').style.width = '100%';
  });
  setTimeout(()=>{ buildAndShowResult(); }, 1600);
}

function buildAndShowResult() {
  const ans = answers;
  const archKey = ans[0]+ans[3]+ans[5];  // Q1+Q4+Q6
  const subKey  = ans[1]+ans[2]+ans[4];  // Q2+Q3+Q5
  const arch    = ARCHETYPES[archKey];
  const subName = SUBTYPES[subKey];
  const color   = HEAD_COLORS[ans[0]+ans[3]]; // Q1+Q4
  const num     = patternNum(ans);

  const happy = [
    Qs[0][ans[0]].happy,
    Qs[2][ans[2]].happy,
    Qs[3][ans[3]].happy,
  ].join('。') + 'こと。';

  const land = [
    Qs[3][ans[3]].pain,
    Qs[0][ans[0]].pain,
    Qs[4][ans[4]].pain,
  ].join('。また、') + 'こと。';

  _char = { arch, subName, num, happy, land, ans };

  document.getElementById('rhead').style.background = color;
  document.getElementById('r-icon').textContent = arch.icon;
  document.getElementById('r-num').textContent = 'No.'+num+' / 64';
  document.getElementById('r-name').textContent = arch.name;
  document.getElementById('r-catch').textContent = arch.catch;
  document.getElementById('r-happy').textContent = happy;
  document.getElementById('r-land').textContent = land;
  document.getElementById('r-guide').textContent = arch.guide;

  const tags = document.getElementById('r-tags');
  tags.innerHTML = `<span class="rhead-tag sub">${subName}</span>`;

  const allAns = document.getElementById('r-all-ans');
  allAns.innerHTML = ans.map((a,i)=>`<span class="ans-chip">${Qs[i][a].sub}</span>`).join('');

  const btn = document.getElementById('btn-copy');
  btn.textContent = '📋 結果をコピーしてLINEで共有';
  btn.classList.remove('ok');

  if(configured) sbFetch('blueprint_results',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({pattern:`${ans.join('')}`,num,archetype:archKey,subtype:subKey})}).catch(()=>{});

  showScreen('s-result');
}

function copyResult() {
  if(!_char) return;
  const { arch, subName, num, happy, land, ans } = _char;
  const txt = [
    '【プロジェクト・ブループリント診断】',
    '',
    `✨ ${arch.name}`,
    `${subName}（No.${num} / 64）`,
    '',
    `「${arch.catch}」`,
    '',
    '🌟 喜ぶポイント',
    happy,
    '',
    '⚡ 地雷ポイント',
    land,
    '',
    '▶ あなたも試してみて',
    'https://kantei-app-gamma.vercel.app/blueprint/',
  ].join('\n');

  navigator.clipboard.writeText(txt).then(()=>{
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ コピーしました！LINEに貼り付けて';
    btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='📋 結果をコピーしてLINEで共有'; btn.classList.remove('ok'); },3000);
  }).catch(()=>alert('コピーできませんでした。手動でコピーしてください。'));
}
</script>
</body>
</html>
